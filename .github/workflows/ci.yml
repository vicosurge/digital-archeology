name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Test
        working-directory: backend
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t digital-archeology:ci .
      - name: Start and check health
        run: |
          docker run -d --name da -p 8000:8000 -e OLLAMA_HOST=http://127.0.0.1:9 digital-archeology:ci
          for i in $(seq 30); do curl -sf localhost:8000/api/health && exit 0; sleep 1; done
          docker logs da
          exit 1

{% if not projects %}
  <div class="panel muted">No projects yet. Create one to begin digging.</div>
{% else %}
  <div class="grid">
    {% for p in projects %}
    <div class="card">
      <div class="row between">
        <strong><a href="/project/{{ p.id }}">{{ p.name }}</a></strong>
        <span class="badge {{ p.status.value }}">{{ p.status.value.replace('_',' ') }}</span>
      </div>
      <div class="domain">{{ p.domain }}</div>
      <div class="stats">
        <div class="stat"><div class="num">{{ p.total_snapshots }}</div><div class="label">On Wayback</div></div>
        <div class="stat"><div class="num">{{ p.files_total }}</div><div class="label">In DB</div></div>
        <div class="stat"><div class="num">{{ p.files_processed }}</div><div class="label">Analyzed</div></div>
      </div>
      <div class="row between">
        <div class="row" style="gap:8px">
          <a class="btn ghost small" href="/project/{{ p.id }}">Open</a>
          <a class="btn ghost small" href="/project/{{ p.id }}/card">Card</a>
        </div>
        <button class="danger small"
                hx-post="/project/{{ p.id }}/delete"
                hx-target="#project-grid"
                hx-swap="innerHTML"
                hx-confirm="Delete project '{{ p.name }}' and all its files?">Delete</button>
      </div>
    </div>
    {% endfor %}
  </div>
{% endif %}

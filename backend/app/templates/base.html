<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Digital Archeology{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="app">
    <div class="brand">
      <a href="/">⛏ Digital Archeology</a>
      <small>&nbsp;— recover websites from the Internet Archive</small>
    </div>
    <a href="/logs" class="small" style="margin-left:auto; margin-right:16px">Logs</a>
    <div id="ollama-status"
         hx-get="/_ollama-status"
         hx-trigger="load, every 15s"
         hx-swap="innerHTML">
      <span class="muted small"><span class="dot checking"></span>checking…</span>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
